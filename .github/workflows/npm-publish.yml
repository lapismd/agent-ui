name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-ui-npm-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  AGENT_UI_VALIDATION_RUNTIME: native

jobs:
  package-gate:
    name: Validate and pack packages
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      packages: ${{ steps.release.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - run: pnpm install --frozen-lockfile

      - name: Validate release identity
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const packages = ['agent-ui', 'repository-ui'].map((directory) => {
            const manifest = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            if (manifest.name !== `@lapismd/${directory}` || manifest.private || manifest.publishConfig?.access !== 'public' || !/^\d+\.\d+\.\d+$/.test(manifest.version)) throw Error('Invalid public package identity');
            return { package: directory, version: manifest.version };
          });
          if (process.env.RELEASE_TAG !== `v${packages[0].version}`) throw Error('Cohort tag must match Agent UI version');
          const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const tagged = execFileSync('git', ['rev-parse', '--verify', `refs/tags/${process.env.RELEASE_TAG}^{commit}`], { encoding: 'utf8' }).trim();
          if (source !== tagged || source !== process.env.GITHUB_SHA) throw Error('Release source must match the immutable tag and workflow source');
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact_name=agent-ui-release-${source}\npackages=${JSON.stringify(packages)}\n`);
          NODE

      - run: pnpm build
      - run: pnpm test:package

      - name: Pack both packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.release"
          (cd packages/agent-ui && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/.release")
          (cd packages/repository-ui && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/.release")
          ls -la "$GITHUB_WORKSPACE/.release"/*.tgz
          test "$(find "$GITHUB_WORKSPACE/.release" -name '*.tgz' | wc -l | tr -d ' ')" = "2"

      - name: Bind exact package versions and artifact integrity
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const packages = ['agent-ui', 'repository-ui'].map((directory) => {
            const { name, version } = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            const tarball = `lapismd-${directory}-${version}.tgz`;
            const bytes = readFileSync(`.release/${tarball}`);
            return { name, version, tarball, integrity: `sha512-${createHash('sha512').update(bytes).digest('base64')}` };
          });
          writeFileSync('.release/manifest.json', JSON.stringify({ source: process.env.GITHUB_SHA, packages }, null, 2) + '\n');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish-production:
    name: Publish with npm trusted publishing
    needs: package-gate
    runs-on: ubuntu-latest
    environment:
      name: npm-production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.package-gate.outputs.packages) }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@12.0.2

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package-gate.outputs.artifact_name }}
          path: .release

      - name: Publish ${{ matrix.package }}
        run: |
          shopt -s nullglob
          tarball=(.release/lapismd-${{ matrix.package }}-${{ matrix.version }}.tgz)
          test "${#tarball[@]}" -eq 1
          published="$(npm view "@lapismd/${{ matrix.package }}@${{ matrix.version }}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$published" = "${{ matrix.version }}" ]; then
            echo "Already published @lapismd/${{ matrix.package }}@${{ matrix.version }}"
            exit 0
          fi
          npm publish "${tarball[0]}" --provenance --access public --registry=https://registry.npmjs.org

  verify-registry:
    name: Verify registry artifacts and provenance
    needs: [package-gate, publish-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package-gate.outputs.artifact_name }}
          path: .release
      - name: Verify exact registry bytes and a clean signed install
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const manifest = JSON.parse(readFileSync('.release/manifest.json', 'utf8'));
          if (manifest.source !== process.env.GITHUB_SHA) throw Error('Release source differs');
          for (const entry of manifest.packages) {
            let verified = false;
            for (let attempt = 1; attempt <= 36; attempt++) {
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(entry.name)}/${entry.version}`);
              if (response.status === 404) {
                if (attempt === 36) throw Error(`Registry metadata unavailable: ${entry.name}`);
                await new Promise((resolve) => setTimeout(resolve, 10000));
                continue;
              }
              if (!response.ok) throw Error(`Registry lookup failed: ${response.status}`);
              const metadata = await response.json();
              if (metadata.name !== entry.name || metadata.version !== entry.version || metadata.dist.integrity !== entry.integrity) throw Error('Registry identity or integrity differs');
              const tarball = await fetch(metadata.dist.tarball);
              if (tarball.status === 404) {
                if (attempt === 36) throw Error(`Registry tarball unavailable: ${entry.name}`);
                await new Promise((resolve) => setTimeout(resolve, 10000));
                continue;
              }
              if (!tarball.ok) throw Error(`Registry tarball failed: ${tarball.status}`);
              const bytes = Buffer.from(await tarball.arrayBuffer());
              const expected = readFileSync(`.release/${entry.tarball}`);
              if (!bytes.equals(expected) || `sha512-${createHash('sha512').update(bytes).digest('base64')}` !== entry.integrity) throw Error('Published artifact bytes differ');
              verified = true;
              break;
            }
            if (!verified) throw Error('Registry verification incomplete');
          }
          const directory = '.release/consumer';
          mkdirSync(directory, { recursive: true });
          writeFileSync(`${directory}/package.json`, JSON.stringify({ private: true, dependencies: Object.fromEntries(manifest.packages.map(({ name, version }) => [name, version])) }));
          execFileSync('npm', ['install', '--ignore-scripts', '--no-audit', '--no-fund', '--registry=https://registry.npmjs.org'], { cwd: directory, stdio: 'inherit' });
          for (const { name, version } of manifest.packages) {
            const installed = JSON.parse(readFileSync(`${directory}/node_modules/${name}/package.json`, 'utf8'));
            if (installed.version !== version) throw Error('Clean consumer version differs');
          }
          execFileSync('npm', ['audit', 'signatures', '--include-attestations'], { cwd: directory, stdio: 'inherit' });
          writeFileSync('.release/registry-receipt.json', JSON.stringify({ ...manifest, verified: true }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: agent-ui-registry-receipt-${{ github.sha }}
          path: |
            .release/registry-receipt.json
            .release/consumer/package-lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
